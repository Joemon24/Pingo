name: Pingo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PINGO_LIVE_GROQ: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --no-sync --with pytest python -m pytest -q
      - run: docker build -t pingo:test .
